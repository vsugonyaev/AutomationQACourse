# Любой параметр можно переопределить без правки файла:
#   системным свойством:    ./gradlew test -Dstand.url=http://host:8080
#   переменной окружения:   STAND_URL=http://host:8080 (точки -> подчёркивания, верхний регистр)

# ===== Стенд =====
stand.url=http://localhost:8080
storefront.path=/
admin.path=/admin
api.url=http://localhost:8080

# ===== Учётные данные администратора =====
admin.username=admin
admin.password=secret123

# ===== API =====
# Таймаут HTTP-соединения и ответа, мс
api.timeout.ms=15000
# Размер страницы, которым запрашиваем "весь" список товаров
api.goods.list.max.size=1000
# Режим логирования запросов/ответов в консоль: NONE, BASIC (только ответы 4xx/5xx), FULL
log.mode=BASIC

# ===== UI =====
ui.browser=chrome
ui.browser.size=1920x1080
ui.headless=false
# Таймаут поиска элементов, мс
ui.element.timeout.ms=5000

# ===== Бизнес-правила магазина =====
shop.name=SmartShop
shop.order.limit=300

# ===== Тестовые данные =====
test.product.name.prefix=Тестовый товар
test.product.price.min=10.00
test.product.price.max=99.99
# id товара, которого на стенде никогда не было
test.missing.product.id=999
# Цены товаров для кейса 3.2 (сумма корзины)
test.cart.first.product.price=21.99
test.cart.second.product.price=42.07

# ===== Ожидаемые сообщения API =====
api.message.add.success=success
api.message.not.found.template=Good with id '%d' is not found
api.message.negative.price=Price can not be less, than 0

# ===== Ожидаемые сообщения UI =====
ui.message.product.added=Товар успешно добавлен!
ui.message.product.updated.template=Товар #%d обновлен
ui.message.added.to.cart.template=%s (%d шт.) добавлен в корзину
ui.message.order.accepted=Заказ принят в обработку!
ui.message.order.title=Заказ успешно оформлен!
ui.message.order.limit.exceeded.template=[%s]: Денег не хватает! Сумма %d ₽ превышает лимит %d ₽.
ui.message.login.error=Неверные учетные данные пользователя
